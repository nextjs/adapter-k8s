## Envoy config fixture for `adapter-k8s emulate`.
##
## Client :8080 → Envoy → ext_proc (routing service, :8443, gRPC/h2c) → Pool Server (:3000)
##
## The ext_proc filter below mirrors the production GXLB traffic-extension callout:
## request headers only (the GCP extension never buffers bodies), fail-CLOSED
## (failure_mode_allow: false — same posture as the emitted extension chain default),
## with routing-header mutations allowed so the service can stamp the internal
## dispatch vocabulary (x-output-id, x-invoke-path, …) and the shared secret that
## makes the pool trust them. `emulate` generates that secret per run and injects
## INTERNAL_HEADER_SECRET into both child processes.
##
## Wire-compatibility of the connectrpc/protobuf-es ext_proc server with a real
## Envoy was validated end-to-end through this config (see the emulate smoke flow);
## the same stack serves the live GXLB callout in production.

static_resources:
  listeners:
    - name: listener_0
      address:
        socket_address:
          # Local emulation is advertised on localhost. Do not expose the app or its unauthenticated
          # ext_proc path to the developer's LAN by binding the front door more broadly.
          address: 127.0.0.1
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: AUTO
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: backend
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/"
                          route:
                            cluster: pool_server
                            timeout: 60s
                http_filters:
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      grpc_service:
                        envoy_grpc:
                          cluster_name: routing_service
                        timeout: 5s
                      # Production parity: the GXLB traffic extension sends request
                      # headers only and fails closed. Body/response phases are
                      # skipped; the routing service still answers an unexpected
                      # phase with a phase-matching CONTINUE (config-skew guard).
                      failure_mode_allow: false
                      message_timeout: 5s
                      processing_mode:
                        request_header_mode: SEND
                        response_header_mode: SKIP
                        request_body_mode: NONE
                        response_body_mode: NONE
                        request_trailer_mode: SKIP
                        response_trailer_mode: SKIP
                      mutation_rules:
                        # The service rewrites :path for rewrites and stamps the
                        # x-* dispatch vocabulary; both need routing mutations.
                        allow_all_routing: true
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: pool_server
      connect_timeout: 5s
      type: STATIC
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: pool_server
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 3000

    - name: routing_service
      connect_timeout: 5s
      type: STATIC
      lb_policy: ROUND_ROBIN
      # The emulated routing service runs plaintext h2c (gRPC needs HTTP/2).
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: routing_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 8443
