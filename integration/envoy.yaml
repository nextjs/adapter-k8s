## Envoy config for local integration testing.
##
## Two modes:
## 1. With ext_proc: Client :8080 → Envoy → ext_proc (:8443) → Pool Server (:3000)
## 2. Without ext_proc: Client :8080 → Envoy → Pool Server (:3000)
##
## Currently runs WITHOUT ext_proc. The pool server handles routing locally via
## resolveRoutes, so the app works correctly without an ext_proc filter here.
##
## The routing service now speaks real protobuf over gRPC via connectrpc
## (@connectrpc/connect-node) using protobuf-es types generated from the upstream
## Envoy protos (buf.build/envoyproxy/envoy → src/routing-service/protos). It can
## therefore be wired as a real ext_proc filter. This is NOT enabled below, and
## end-to-end wire-compatibility with a real Envoy/GCP ext_proc caller is
## UNVALIDATED (only the converter + protobuf codec are round-tripped in unit
## tests). The App Hosting adapter uses this same stack, validated against a live
## deployment; this adapter needs the equivalent smoke test.
##
## TODO: Add the ext_proc HTTP filter + ext_proc cluster (routing service on
## :8443, HTTP/2) to the filter_chain and validate end-to-end against this Envoy
## before relying on the ext_proc path.

static_resources:
  listeners:
    - name: listener_0
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: AUTO
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: backend
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/"
                          route:
                            cluster: pool_server
                            timeout: 60s
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: pool_server
      connect_timeout: 5s
      type: STATIC
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: pool_server
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 3000
