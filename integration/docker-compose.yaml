## Integration test stack for adapter-k8s
##
## Replicates the GKE deployment locally:
##   Envoy (ALB) → Routing Service (ext_proc) → Pool Server (handler)
##
## Usage:
##   1. Build a Next.js app with the adapter first
##   2. docker compose -f integration/docker-compose.yaml up
##   3. curl http://localhost:8080
##
## Or use the integration test script:
##   ./scripts/e2e-integration.sh

services:
  envoy:
    image: envoyproxy/envoy:v1.32-latest
    ports:
      - "8080:8080"
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
    network_mode: host
    depends_on:
      routing-service:
        condition: service_started
      pool-server:
        condition: service_started

  routing-service:
    image: node:22-slim
    working_dir: /app
    volumes:
      - "${APP_DIR:-.}/.k8s-adapter/output/routing-service/context:/app"
      - "${ADAPTER_DIR:-..}/dist/routing-service.cjs:/app/routing-service.cjs"
    environment:
      - NODE_ENV=production
      - NEXT_BUILD_ID=${BUILD_ID:-local}
      - PORT=8443
      - CONFIG_DIR=/app/config
    command: ["node", "routing-service.cjs"]
    network_mode: host

  pool-server:
    image: node:22-slim
    working_dir: /app
    volumes:
      - "${APP_DIR:-.}/.k8s-adapter/output/pools/default/context:/app"
      - "${ADAPTER_DIR:-..}/dist/pool-server.cjs:/app/pool-server.cjs"
    environment:
      - NODE_ENV=production
      - NEXT_BUILD_ID=${BUILD_ID:-local}
      - PORT=3000
      - POOL_NAME=default
      - CONFIG_DIR=/app/config
    command: ["node", "pool-server.cjs"]
    network_mode: host
