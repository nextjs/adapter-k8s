name: ci

on:
  push:
    branches: [main]
  # No base-branch filter: the filter matches the PR's BASE, which silently skipped
  # CI for PRs targeting a feature branch instead of main.
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Unit Test (Node 24 runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run fmt:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify packed package
        run: node scripts/verify-package.mjs

      - name: Run unit tests
        run: npm test

      - name: Audit dependencies
        run: npm audit --audit-level=low

  minimum-node-build:
    name: Build and CLI (Node 20.16 minimum host)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.16.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify minimum host primitive
        run: node -e 'if (typeof process.getBuiltinModule !== "function") process.exit(1)'

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Load the CLI
        run: node dist/cli.cjs --help

  chart-schema:
    name: Helm and Kubernetes Schema
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Render charts and validate native Kubernetes resources
        run: npm run test:schema
