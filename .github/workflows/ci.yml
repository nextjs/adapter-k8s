name: ci

on:
  push:
    branches: [main, jamesdaniels_wip]
  pull_request:
    branches: [main, jamesdaniels_wip]

jobs:
  build-and-test:
    name: Build and Unit Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm test
