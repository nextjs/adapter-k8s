name: release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish npm package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"

      - name: Pin an OIDC-capable npm CLI
        run: npm install --global npm@11.19.1

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node -e 'const p=require("./package.json"); if (process.env.RELEASE_TAG !== `v${p.version}`) { console.error(`release tag ${process.env.RELEASE_TAG} does not match package v${p.version}`); process.exit(1) }'

      - name: Verify release commit is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main || {
            echo "Release tag must point to a commit merged into main" >&2
            exit 1
          }

      - name: Install dependencies
        run: npm ci

      # prepublishOnly runs release:check; prepack then rebuilds the exact artifact npm uploads.
      - name: Publish with provenance
        run: npm publish --access public --provenance
        env:
          # OIDC takes precedence. This optional fallback exists only to bootstrap the package's
          # first publish; remove the repository secret after npm trusted publishing is configured.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
