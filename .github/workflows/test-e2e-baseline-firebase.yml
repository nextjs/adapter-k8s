name: test-e2e-baseline-firebase

on:
  workflow_dispatch:
    inputs:
      firebaseToolsVersion:
        description: "npm version/tag for firebase-tools"
        default: "latest"
        type: string
      nextjsRef:
        description: "Next.js repo ref (branch/tag/SHA)"
        default: "canary"
        type: string

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install repo dependencies
        run: npm ci

      - name: Run single-suite Firebase CLI baseline deploy test
        env:
          FIREBASE_TOOLS_BASELINE_VERSION: ${{ inputs.firebaseToolsVersion }}
          NEXTJS_REF: ${{ inputs.nextjsRef }}
        run: bash scripts/e2e-firebase-baseline.sh "" "${{ inputs.nextjsRef }}"
