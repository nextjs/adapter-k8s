name: test-e2e-baseline-firebase

on:
  workflow_dispatch:
    inputs:
      firebaseToolsVersion:
        description: "npm version/tag for firebase-tools"
        default: "latest"
        type: string
      nextjsRef:
        description: "Next.js repo ref (branch/tag/SHA)"
        default: "canary"
        type: string

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm

      - name: Install repo dependencies
        run: npm ci

      - name: Run single-suite Firebase CLI baseline deploy test
        env:
          FIREBASE_TOOLS_BASELINE_VERSION: ${{ inputs.firebaseToolsVersion }}
          NEXTJS_REF: ${{ inputs.nextjsRef }}
        # Read the ref through the env mapping above, never `${{ }}` inside the run script:
        # GitHub substitutes the expression BEFORE bash sees it, so a value containing a quote
        # can close the argument and append its own commands, with the job's runner context and
        # the credential actions/checkout persisted.
        run: bash scripts/e2e-firebase-baseline.sh "" "$NEXTJS_REF"
