name: test-e2e-deploy

on:
  workflow_dispatch:
    inputs:
      nextjsRef:
        description: "Pinned Next.js tag or commit SHA"
        required: true
        default: "v16.3.0-canary.97"
        type: string

permissions:
  contents: read

jobs:
  e2e:
    name: Canonical local deploy suite
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      E2E_PLAYWRIGHT_WITH_DEPS: "1"
      NEXT_TEST_CONCURRENCY: "4"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm

      - name: Install adapter dependencies
        run: npm ci

      - name: Install pinned Corepack
        run: npm install --global corepack@0.31.0 && corepack enable # zizmor: ignore[adhoc-packages]

      - name: Run canonical deploy suite
        env:
          NEXTJS_REF: ${{ inputs.nextjsRef }}
        run: bash scripts/e2e-local.sh "" "$NEXTJS_REF"
